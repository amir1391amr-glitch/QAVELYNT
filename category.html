<style>
:root {
  --black:#100E0C;
  --dark:#191511;
  --brown:#60432F;
  --cream:#F1E8D8;
  --soft:#B9A58E;
  --line:#352A21;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--black);
  color:var(--cream);
  font-family:Arial,sans-serif;
}
header {
  padding:22px 7%;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo {
  font-size:20px;
  letter-spacing:3px;
  font-weight:bold;
}
.logo span { color:var(--soft); }
nav a {
  color:var(--soft);
  text-decoration:none;
  margin-left:18px;
  font-size:13px;
}
main {
  width:min(1100px,86%);
  margin:70px auto;
}
.eyebrow {
  color:var(--soft);
  letter-spacing:3px;
  font-size:12px;
}
h1 {
  font-size:clamp(38px,7vw,65px);
  margin:18px 0;
}
.intro {
  color:var(--soft);
  line-height:1.9;
  max-width:650px;
}
.search {
  width:100%;
  margin-top:35px;
  padding:16px;
  background:var(--dark);
  border:1px solid var(--line);
  color:var(--cream);
  font-size:15px;
  outline:none;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
  margin-top:25px;
}
.item {
  padding:24px;
  background:var(--dark);
  border:1px solid var(--line);
  color:var(--cream);
  text-decoration:none;
  transition:.2s;
}
.item:hover {
  border-color:var(--soft);
  transform:translateY(-3px);
}
.item h3 { margin:0 0 10px; font-size:18px; }
.item p {
  color:var(--soft);
  font-size:13px;
  line-height:1.7;
  margin:0;
}
.back {
  display:inline-block;
  margin-top:50px;
  color:var(--soft);
  text-decoration:none;
}
footer {
  border-top:1px solid var(--line);
  padding:25px;
  color:var(--soft);
  font-size:12px;
  text-align:center;
}
</style>
</head>
<body>
<header>
  <div class="logo">QAVE<span>LYNT</span></div>
  <nav><a href="index.html">Home</a></nav>

  <a class="back" href="index.html">← Back to Home</a>

const params = new URLSearchParams(location.search);
const key = params.get("category") || "technology";
const category = categories[key] || categories.technology;

document.title = category.title + " | QAVELYNT";
document.getElementById("heading").textContent = category.title;
document.getElementById("description").textContent = category.description;

const grid = document.getElementById("grid");
const search = document.getElementById("search");

function render() {
  const query = search.value.toLowerCase();
  grid.innerHTML = "";
  category.topics
    .filter(topic => topic.toLowerCase().includes(query))
    .forEach(topic => {
      const card = document.createElement("div");
      card.className = "item";
      const title = document.createElement("h3");
      title.textContent = topic;
      const description = document.createElement("p");
      description.textContent = "Explore ideas, share knowledge and connect with others.";
      card.append(title, description);
      grid.appendChild(card);
    });
}
search.addEventListener("input", render);
