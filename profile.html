
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QAVELYNT | Avatar Studio</title>
<style>
:root{
 --bg:#100E0C;--panel:#191511;--cream:#F1E8D8;
 --soft:#B9A58E;--brown:#60432F;--line:#352A21;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--cream);
 font-family:Arial,sans-serif;padding:25px 16px 50px;
}
main{max-width:1000px;margin:auto}
header{text-align:center;margin:20px 0 30px}
.logo{font-size:24px;letter-spacing:5px;font-weight:bold}
header p{color:var(--soft);font-size:13px}
h1{font-size:25px;margin:28px 0 8px}
.sub{color:var(--soft);font-size:13px}
.preview{
 background:var(--panel);border:1px solid var(--line);
 border-radius:18px;padding:20px;text-align:center;margin:25px 0;
}
.preview img{width:110px;height:110px;object-fit:contain}
.preview p{color:var(--soft);font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}
.tabs button{
 background:var(--panel);color:var(--cream);
 border:1px solid var(--line);padding:11px 15px;
 border-radius:10px;cursor:pointer
}
.tabs button.active{background:var(--cream);color:var(--bg)}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));
 gap:12px;
}
.avatar{
 background:var(--panel);border:1px solid var(--line);
 border-radius:15px;padding:12px 7px 9px;
 cursor:pointer;text-align:center;transition:.2s;
}
.avatar:hover{border-color:var(--soft);transform:translateY(-2px)}
.avatar.selected{border:2px solid var(--cream);background:#292017}
.avatar img{width:78px;height:78px;display:block;margin:auto}
.avatar span{display:block;font-size:11px;color:var(--soft);margin-top:7px}
.actions{display:flex;justify-content:center;gap:10px;margin-top:25px}
.actions button{
 padding:12px 22px;border-radius:10px;border:0;
 cursor:pointer;font-weight:bold
}
.save{background:var(--cream);color:var(--bg)}
.reset{background:var(--panel);color:var(--cream);border:1px solid var(--line)!important}
#message{text-align:center;color:var(--soft);font-size:12px;margin-top:15px}
</style>
</head>
<body>
<main>
<header>
 <div class="logo">QAVELYNT</div>
 <p>CONNECT IDEAS. BUILD TOMORROW.</p>
 <h1>Avatar Studio</h1>
 <div class="sub">آواتار اختصاصی خودت را انتخاب کن</div>
</header>

<section class="preview">
 <img id="preview" alt="Selected avatar">
 <div id="selectedName">یک آواتار انتخاب کن</div>
 <p>پیش‌نمایش تصویر پروفایل</p>
</section>

<nav class="tabs" id="tabs">
 <button class="active" data-cat="people">انسان‌ها</button>
 <button data-cat="animals">حیوانات</button>
 <button data-cat="plants">گیاهان</button>
 <button data-cat="fantasy">فانتزی</button>
 <button data-cat="all">همه</button>
</nav>

<section class="grid" id="grid"></section>

<div class="actions">
 <button class="save" id="save">ذخیره انتخاب</button>
 <button class="reset" id="reset">لغو انتخاب</button>
</div>
<div id="message"></div>
</main>

<script>
const palettes=[
 ['#E8C9A7','#60432F','#B98257'],
 ['#D9B99B','#49382F','#9C7051'],
 ['#EEDCC5','#70513D','#C18B61'],
 ['#C9A98D','#382C26','#8D6248'],
 ['#F0D7B8','#76523B','#B77A52'],
 ['#D6B89A','#554136','#A77C5C'],
 ['#E7CDB2','#49372D','#C08A64'],
 ['#DCC1A5','#60442F','#A8734E']
];

const people=[
'آرمان','رها','آراد','آوا','سام','نورا','پارسا','نیلا','ماهان','هانا'
];
const animals=[
'روباه','گربه','شیر','خرگوش','خرس','گوزن','جغد','پاندا','گرگ','پرنده'
];
const plants=[
'رز','آفتابگردان','کاکتوس','لاله','برگ استوایی','قارچ','بونسای','نیلوفر','سرخس','درخت'
];
const fantasy=[
'فضانورد','ماه‌نشین','جادوگر','اژدها','ستاره','نگهبان','روح جنگل','سیاره','ققنوس','شوالیه'
];

function svg(content,bg='#F1E8D8'){
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<rect width="120" height="120" rx="28" fill="${bg}"/>
${content}</svg>`;
}
function person(i){
let p=palettes[i%8],female=i%2===1;
let hair=female?
`<path d="M27 57 Q20 12 61 16 Q103 15 94 62 L89 92 Q75 108 79 62 L39 62 L39 96 Q20 93 27 57" fill="${p[1]}"/>`:
`<path d="M29 49 Q26 13 61 17 Q96 14 91 50 Q76 31 48 37 Q36 41 29 49" fill="${p[1]}"/>`;
return svg(`
<path d="M15 120 Q17 82 60 81 Q103 82 105 120" fill="${p[2]}"/>
<path d="M48 79 L48 94 L60 103 L72 94 L72 79" fill="${p[0]}"/>
${hair}
<ellipse cx="60" cy="57" rx="29" ry="35" fill="${p[0]}"/>
<path d="M43 57 Q48 52 53 57 M67 57 Q73 52 78 57" fill="none" stroke="${p[1]}" stroke-width="3" stroke-linecap="round"/>
<path d="M54 70 Q60 75 67 70" fill="none" stroke="${p[2]}" stroke-width="2.5" stroke-linecap="round"/>
<path d="M31 47 Q25 65 32 83 M89 47 Q95 65 88 83" fill="none" stroke="${p[1]}" stroke-width="5" stroke-linecap="round"/>
<circle cx="49" cy="58" r="2" fill="${p[1]}"/><circle cx="72" cy="58" r="2" fill="${p[1]}"/>
`);
}
function animal(i){
let p=palettes[i%8];
let ears=[
'<path d="M35 42 L27 12 L51 31 M69 31 L93 12 L85 45" />',
'<path d="M30 43 Q9 9 39 23 M81 43 Q111 9 81 23"/>',
'<path d="M27 48 L20 14 L48 34 M73 34 L100 14 L93 48"/>',
'<path d="M32 40 L28 10 L50 33 M70 33 L92 10 L88 40"/>'
][i%4];
return svg(`
<g fill="${p[1]}" stroke="${p[1]}" stroke-width="5" stroke-linejoin="round">${ears}</g>
<ellipse cx="60" cy="65" rx="37" ry="35" fill="${p[0]}"/>
<ellipse cx="46" cy="62" rx="4" ry="5" fill="${p[1]}"/>
<ellipse cx="74" cy="62" rx="4" ry="5" fill="${p[1]}"/>
<ellipse cx="60" cy="75" rx="10" ry="7" fill="${p[2]}"/>
<path d="M56 78 Q60 84 64 78" fill="none" stroke="${p[1]}" stroke-width="2"/>
<circle cx="60" cy="74" r="3" fill="${p[1]}"/>
<path d="M28 95 Q60 110 92 95" fill="none" stroke="${p[2]}" stroke-width="5" stroke-linecap="round"/>
`);
}
function plant(i){
let p=palettes[i%8];
let leaves='';
for(let j=0;j<5;j++){
let x=60+(j-2)*13;
leaves+=`<ellipse cx="${x}" cy="${57-Math.abs(j-2)*5}" rx="11" ry="25" transform="rotate(${(j-2)*25} ${x} 57)" fill="${j%2?p[2]:p[1]}"/>`;
}
let flower=i%3===0;
return svg(`
<path d="M60 109 Q58 78 60 53" stroke="${p[1]}" stroke-width="5" fill="none"/>
${flower?`
${Array.from({length:8},(_,j)=>`<ellipse cx="60" cy="35" rx="9" ry="18" transform="rotate(${j*45} 60 35)" fill="${p[2]}"/>`).join('')}
<circle cx="60" cy="35" r="10" fill="${p[0]}"/>`:leaves}
<path d="M60 83 Q35 58 28 78 Q42 97 60 83 M60 91 Q82 64 94 81 Q82 103 60 91" fill="${p[2]}"/>
<path d="M35 111 Q60 104 85 111" stroke="${p[1]}" stroke-width="4" fill="none" stroke-linecap="round"/>
`);
}
function fantasyAvatar(i){
let p=palettes[i%8];
let shapes=[
`<circle cx="60" cy="56" r="31" fill="${p[1]}"/><circle cx="60" cy="56" r="24" fill="${p[0]}"/><path d="M45 48 L52 56 L45 64 M75 48 L68 56 L75 64" stroke="${p[2]}" stroke-width="4" fill="none"/>`,
`<circle cx="60" cy="57" r="33" fill="${p[0]}"/><path d="M29 45 Q60 5 91 45" fill="none" stroke="${p[1]}" stroke-width="9"/><circle cx="60" cy="56" r="9" fill="${p[2]}"/>`,
`<path d="M60 15 L72 45 L104 55 L72 67 L60 101 L48 67 L16 55 L48 45Z" fill="${p[2]}"/><circle cx="60" cy="55" r="13" fill="${p[0]}"/>`,
`<path d="M60 13 Q78 38 95 53 Q86 91 60 105 Q34 91 25 53Z" fill="${p[1]}"/><path d="M60 27 L78 57 L60 85 L42 57Z" fill="${p[0]}"/>`
];
return svg(shapes[i%4]);
}

const groups={
 people,animals,plants,fantasy
};
const renderers={
 people:person,animals:animal,plants:plant,fantasy:fantasyAvatar
};
let selected=null;
let current='people';
const grid=document.getElementById('grid');

function render(){
grid.innerHTML='';
Object.keys(groups).forEach(cat=>{
if(current!=='all'&&current!==cat)return;
groups[cat].forEach((name,i)=>{
const id=cat+'-'+i;
const card=document.createElement('div');
card.className='avatar'+(selected===id?' selected':'');
const img=document.createElement('img');
img.src='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(renderers[cat](i));
img.alt=name;
const label=document.createElement('span');
label.textContent=name;
card.append(img,label);
card.onclick=()=>{
selected=id;
document.getElementById('preview').src=img.src;
document.getElementById('selectedName').textContent=name;
document.getElementById('message').textContent='';
render();
};
grid.append(card);
});
});
}
document.querySelectorAll('.tabs button').forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
current=btn.dataset.cat;
render();
};
});
document.getElementById('save').onclick=()=>{
if(!selected){document.getElementById('message').textContent='اول یک آواتار انتخاب کن.';return;}
localStorage.setItem('qavelynt-avatar-id',selected);
document.getElementById('message').textContent='انتخابت در همین مرورگر ذخیره شد.';
};
document.getElementById('reset').onclick=()=>{
selected=null;
document.getElementById('preview').removeAttribute('src');
document.getElementById('selectedName').textContent='یک آواتار انتخاب کن';
document.getElementById('message').textContent='انتخاب لغو شد.';
render();
};
render();
</script>
</body>
</html>
